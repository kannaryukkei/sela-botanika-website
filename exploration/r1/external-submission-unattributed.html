<!--
================================================================================
ADES R1 SUBMISSION — SELA BOTANIKA (BANDUNG STUDIO CONCEPT)
Mode: studio_development | Internal experiment only; NOT FOR RELEASE
================================================================================

1. EXACT UI MODEL LABEL:
   NOT_DISCLOSED (Model/version label is not surfaced in the consumer UI)

2. INDEPENDENTLY INSPECTED NICHE REFERENCES (3+ Distinct Domains):
   Note: Built upon shared GPT context (root-houseplants.com, plantcultureltd.com,
   nicheplantshop.com; soilboy.live marked NOT_INSPECTED). Three additional
   independent domains inspected via search/snippet analysis:

   Reference A: Patch Plants — https://www.patchplants.com/pages/plant-care/complete-guide-to-indoor-light/
   - Navigation & Hierarchy: Utility-first editorial care hub nested cleanly under
     primary plant shopping; structured by practical room-condition questions
     ("How do you know what kind of light you have?").
   - Content Structure & Tone: Demystifies plant selection using tangible physical
     heuristics (e.g., the hand-shadow test at midday) rather than intimidating
     botanical jargon; categorizes light into Bright/Direct, Medium/Indirect, and
     Low light with explicit caveats about windowless rooms.
   - Lesson Adopted: Anchor Sela Botanika's core interactive Room-Fit Explorer around
     honest, observable room light and weekly care rhythm rather than promising
     miracle survival.

   Reference B: Foliage Living — https://foliageliving.ca/fr (and root https://foliageliving.ca/)
   - Navigation & Hierarchy: Balanced three-pillar boutique structure separating
     retail ("Boutique"), experiential learning ("Upcoming Workshops / DIY Kits"),
     and spatial consulting ("Design Services / Repotting").
   - Typography/Color & Imagery: Warm editorial journal aesthetic paired with
     clean serif/sans hierarchy, soft botanical neutrals, and tactile studio
     storytelling ("bring the outdoors in at home or in the workplace").
   - CTA & Conversion: Low-pressure discovery CTAs ("Explore Workshops",
     "Explore Plant Styling") rather than aggressive flash-sale banners.
   - Lesson Adopted: Give residential/commercial plant styling and hands-on
     beginner workshops dedicated, breathable editorial sections distinct from
     general plant browsing.

   Reference C: Bloomscape — https://bloomscape.com/plant-care-guides/
   - Navigation & Hierarchy: Clear top-level split between "Plants", "Care and
     Accessories", "Gifts", and "Learn / Grow-How".
   - Content Structure & Micro-copy: Pairs curated plant discovery with accessory
     bundles (pots, potting soil, moisture tools) and transparent, non-alarmist
     care guidance (watering rhythm, light acclimation, seasonal shifts).
   - Responsive & Motion Behavior: Modular card grids that stack cleanly on
     mobile viewports with calm hover elevation and clear category filtering.
   - Lesson Adopted: Present Starter Sets, Pots/Media/Tools, and Plants in a
     filterable catalog with clear synthetic price bands and explicit caveats.

   (Additional contextual check: https://www.thesill.com/pages/workshops-events —
   confirmed beginner-friendly interactive framing around watering, light, and
   repotting without overpromising outcomes.)

3. DESIGN PRINCIPLES ADOPTED:
   - Bandung Studio Warmth & Tactile Calm: Inspired by Bandung's highland climate,
     creative studio culture, and terracotta/volcanic-stone materiality—using warm
     linen (#F7F4EE), deep forest canopy (#1F352B), unglazed terracotta (#B85D3B),
     and soft sage (#DCE3D8) with high-contrast readable typography.
   - Context-First Discovery over SKU Volume: Visitors first explore how plants
     align with their room light and realistic weekly time before browsing
     indicative category price bands.
   - Strict Epistemic & Operational Honesty: Every price band is explicitly
     tagged as an illustrative estimate requiring studio confirmation; no fake
     inventory counts, addresses, phone numbers, workshop schedules, or medical/
     pet-safety/air-purifying claims are fabricated.

4. SIMULATED & INTERACTIVE BEHAVIORS (Client-Side Only, Zero Backend):
   - Mobile Navigation Drawer: Accessible hamburger toggle with ARIA states and
     Escape-key dismissal.
   - Interactive Room-Fit Guidance Explorer: Users select Light Level (Low /
     Bright Indirect / Filtered Sun) and Weekly Care Time (10 mins / 20–30 mins /
     45+ mins) plus Space Type (Desk/Shelf / Apartment Corner / Café/Studio) to
     filter illustrative plant archetypes and care habits, accompanied by an
     explicit non-diagnostic, non-guaranteed caveat.
   - Category & Indicative Price Band Filter: Interactive tabs filtering Plants
     (Rp35.000–450.000), Pots/Media/Tools (Rp15.000–180.000), Starter Sets
     (Rp85.000–250.000), and Workshops (Rp100.000–175.000/participant), plus
     custom-quoted Styling.
   - Styling Scope Toggle (Home/Apartment vs. Café/Creative Studio): Switches
     tailored walkthrough notes and indicative project scope framing without
     quoting fixed prices.
   - Non-Sending Contact / Inquiry Composer: Interactive form that previews a
     formatted inquiry note locally and explicitly displays a transparent notice
     that no message is transmitted because no contact channel is configured in
     this studio_development prototype.

5. IMAGE URLS, PROVENANCE & RIGHTS STATUS:
   All imagery uses curated Unsplash photography via direct public CDN URLs
   (images.unsplash.com), free for commercial and non-commercial use under the
   Unsplash License. Every image is captioned/attributed as illustrative mood &
   botanical reference only—never representing actual Sela Botanika stock,
   premises, staff, or customers.
   - Hero image: https://images.unsplash.com/photo-1463320726281-696a485928c7?auto=format&fit=crop&w=1400&q=80
     (Sunlit indoor plants in ceramic pots by warm window — Unsplash License)
   - Low-light / Foliage texture: https://images.unsplash.com/photo-1545241047-6083a3684587?auto=format&fit=crop&w=900&q=80
     (Lush green indoor tropical foliage — Unsplash License)
   - Terracotta pots & soil tools: https://images.unsplash.com/photo-1485955900006-10f4d324d411?auto=format&fit=crop&w=900&q=80
     (Terracotta planters and indoor greenery — Unsplash License)
   - Starter set / tabletop plant: https://images.unsplash.com/photo-1509423350716-97f9360b4e09?auto=format&fit=crop&w=900&q=80
     (Small potted indoor plant on wooden surface — Unsplash License)
   - Workshop table / potting craft: https://images.unsplash.com/photo-1416879595882-3373a0480b5b?auto=format&fit=crop&w=900&q=80
     (Hands potting plants with soil and small tools — Unsplash License)
   - Residential / Café plant styling: https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=1100&q=80
     (Warm sunlit living/studio interior styled with indoor plants — Unsplash License)

6. RESPONSIVE & MOTION IMPLEMENTATION:
   - Mobile-first fluid grid using CSS custom properties, clamp() typography,
     and breakpoints at 640px, 900px, and 1120px.
   - Subtle, hardware-accelerated CSS transitions on interactive pills, cards,
     and accordion disclosures, respecting `@media (prefers-reduced-motion: reduce)`.
   - Keyboard-accessible focus rings (`:focus-visible`), semantic landmarks
     (`<header>`, `<main>`, `<section>`, `<nav>`, `<footer>`), ARIA tabs/
     live-regions, and native `<details>`/`<summary>` FAQ disclosures.

7. WHAT WAS NOT RENDERED OR TESTED:
   - Real brand logo mark and proprietary phone photography (described in brief
     as unsupplied; replaced with clean typographic wordmark + geometric leaf
     SVG emblem and clearly labeled illustrative photography).
   - Live e-commerce checkout, inventory stock levels, calendar booking,
     WhatsApp/email dispatch, or backend APIs (intentionally omitted per rules).
   - Live cross-browser or physical device QA was not executed in this environment;
     standard compliant HTML5/CSS3/ES6 patterns are used throughout.

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sela Botanika — Indoor Plants, Potting Craft &amp; Space Styling (Bandung Studio Concept)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-cream: #F7F4EE;
      --bg-warm: #EFE9DE;
      --bg-card: #FCFBF8;
      --ink-primary: #1D2B24;
      --ink-secondary: #46574E;
      --ink-muted: #65756C;
      --forest: #1F3A2E;
      --forest-hover: #162B22;
      --sage-soft: #DCE4D8;
      --sage-tint: #EBF0E8;
      --terracotta: #B55B38;
      --terracotta-soft: #F4E6DF;
      --border-subtle: rgba(29, 43, 36, 0.12);
      --border-strong: rgba(29, 43, 36, 0.24);
      --shadow-soft: 0 10px 30px rgba(29, 43, 36, 0.06);
      --shadow-card: 0 4px 16px rgba(29, 43, 36, 0.04);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 22px;
      --font-serif: 'Fraunces', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --container-max: 1160px;
      --transition: 220ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    body {
      margin: 0;
      font-family: var(--font-sans);
      background-color: var(--bg-cream);
      color: var(--ink-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    img {
      display: block;
      max-width: 100%;
      height: auto;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button, input, select, textarea {
      font: inherit;
      color: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--terracotta);
      outline-offset: 3px;
    }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0.75rem;
      z-index: 1000;
      background: var(--forest);
      color: #fff;
      padding: 0.65rem 1rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
    }
    .skip-link:focus {
      left: 0.75rem;
    }

    .container {
      width: 100%;
      max-width: var(--container-max);
      margin-inline: auto;
      padding-inline: 1.25rem;
    }

    @media (min-width: 768px) {
      .container { padding-inline: 2rem; }
    }

    /* Concept Banner */
    .concept-bar {
      background: var(--forest);
      color: #E9EFEA;
      font-size: 0.78rem;
      letter-spacing: 0.01em;
      padding: 0.5rem 1rem;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }
    .concept-bar strong {
      color: #F6D8C8;
      font-weight: 600;
    }

    /* Header & Nav */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 90;
      background: rgba(247, 244, 238, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-subtle);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 4.5rem;
      gap: 1rem;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      font-family: var(--font-serif);
      font-size: 1.35rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--forest);
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      background: var(--sage-soft);
      color: var(--forest);
      flex-shrink: 0;
    }

    .brand-sub {
      display: block;
      font-family: var(--font-sans);
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--ink-muted);
      margin-top: -0.15rem;
    }

    .nav-desktop {
      display: none;
      align-items: center;
      gap: 1.65rem;
    }

    @media (min-width: 920px) {
      .nav-desktop { display: flex; }
    }

    .nav-desktop a {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--ink-secondary);
      transition: color var(--transition);
    }

    .nav-desktop a:hover {
      color: var(--forest);
    }

    .header-cta {
      display: none;
    }
    @media (min-width: 920px) {
      .header-cta { display: inline-flex; }
    }

    .menu-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 0.5rem 0.75rem;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      gap: 0.4rem;
    }

    @media (min-width: 920px) {
      .menu-toggle { display: none; }
    }

    .nav-mobile {
      display: none;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-subtle);
      padding: 1rem 1.25rem 1.5rem;
    }
    .nav-mobile.is-open {
      display: block;
    }
    .nav-mobile ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.65rem;
    }
    .nav-mobile a {
      display: block;
      padding: 0.5rem 0;
      font-weight: 500;
      color: var(--ink-primary);
      border-bottom: 1px solid var(--border-subtle);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.78rem 1.35rem;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background-color var(--transition), transform var(--transition), border-color var(--transition), color var(--transition);
    }

    .btn-primary {
      background: var(--forest);
      color: #F7F4EE;
    }
    .btn-primary:hover {
      background: var(--forest-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: transparent;
      border-color: var(--border-strong);
      color: var(--ink-primary);
    }
    .btn-secondary:hover {
      background: var(--bg-warm);
      border-color: var(--forest);
    }

    .btn-sm {
      padding: 0.52rem 1rem;
      font-size: 0.84rem;
    }

    /* Typography & Section Helpers */
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--terracotta);
      margin-bottom: 0.65rem;
    }

    h1, h2, h3, h4 {
      font-family: var(--font-serif);
      font-weight: 500;
      line-height: 1.18;
      letter-spacing: -0.02em;
      margin: 0;
      color: var(--ink-primary);
    }

    h1 {
      font-size: clamp(2.15rem, 4.5vw, 3.45rem);
    }

    h2 {
      font-size: clamp(1.7rem, 3.2vw, 2.45rem);
    }

    h3 {
      font-size: clamp(1.2rem, 2vw, 1.45rem);
    }

    .section {
      padding-block: 4rem;
    }
    @media (min-width: 900px) {
      .section { padding-block: 5.5rem; }
    }

    .section-alt {
      background: var(--bg-warm);
      border-top: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
    }

    .section-head {
      max-width: 660px;
      margin-bottom: 2.5rem;
    }
    .section-head p {
      margin: 0.85rem 0 0;
      color: var(--ink-secondary);
      font-size: 1.02rem;
    }

    /* Hero */
    .hero {
      padding-block: 2.75rem 4rem;
    }
    @media (min-width: 900px) {
      .hero { padding-block: 4rem 5.5rem; }
    }

    .hero-grid {
      display: grid;
      gap: 2.25rem;
      align-items: center;
    }

    @media (min-width: 920px) {
      .hero-grid {
        grid-template-columns: 1.08fr 0.92fr;
        gap: 3.5rem;
      }
    }

    .hero-lead {
      margin: 1.15rem 0 1.75rem;
      font-size: 1.08rem;
      color: var(--ink-secondary);
      max-width: 56ch;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
      margin-bottom: 2rem;
    }

    .hero-pillars {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 0.85rem;
      padding-top: 1.35rem;
      border-top: 1px solid var(--border-subtle);
    }

    .pillar-item dt {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-muted);
    }

    .pillar-item dd {
      margin: 0.2rem 0 0;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--ink-primary);
    }

    .media-frame {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--sage-soft);
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--border-subtle);
    }

    .media-frame img {
      width: 100%;
      aspect-ratio: 4 / 4.3;
      object-fit: cover;
    }

    .illustrative-caption {
      font-size: 0.74rem;
      color: var(--ink-muted);
      background: rgba(252, 251, 248, 0.94);
      padding: 0.55rem 0.85rem;
      border-top: 1px solid var(--border-subtle);
      line-height: 1.4;
    }

    /* Interactive Room-Fit Guidance */
    .fit-workbench {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow-soft);
    }

    @media (min-width: 900px) {
      .fit-workbench { padding: 2.25rem; }
    }

    .fit-controls {
      display: grid;
      gap: 1.35rem;
      padding-bottom: 1.75rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    @media (min-width: 860px) {
      .fit-controls {
        grid-template-columns: repeat(3, 1fr);
        gap: 1.5rem;
      }
    }

    .control-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-secondary);
      margin-bottom: 0.6rem;
    }

    .pill-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .pill-btn {
      background: var(--bg-cream);
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      padding: 0.48rem 0.9rem;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
    }

    .pill-btn:hover {
      border-color: var(--forest);
    }

    .pill-btn[aria-pressed="true"] {
      background: var(--forest);
      border-color: var(--forest);
      color: #F7F4EE;
    }

    .fit-output {
      margin-top: 1.75rem;
    }

    .fit-summary-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .fit-summary-text {
      font-size: 0.95rem;
      color: var(--ink-secondary);
      margin: 0;
    }

    .fit-cards {
      display: grid;
      gap: 1.15rem;
    }

    @media (min-width: 768px) {
      .fit-cards { grid-template-columns: repeat(3, 1fr); }
    }

    .fit-card {
      background: var(--bg-cream);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.85rem;
    }

    .fit-tag {
      display: inline-block;
      font-size: 0.73rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      background: var(--sage-soft);
      color: var(--forest);
      margin-bottom: 0.55rem;
    }

    .fit-card h3 {
      font-size: 1.18rem;
      margin-bottom: 0.35rem;
    }

    .fit-card p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--ink-secondary);
    }

    .fit-meta {
      padding-top: 0.75rem;
      border-top: 1px dashed var(--border-strong);
      font-size: 0.82rem;
      color: var(--ink-muted);
    }

    .caveat-box {
      margin-top: 1.35rem;
      background: var(--terracotta-soft);
      border-left: 3px solid var(--terracotta);
      border-radius: var(--radius-sm);
      padding: 0.9rem 1.1rem;
      font-size: 0.85rem;
      color: var(--ink-primary);
    }

    /* Catalog & Synthetic Price Bands */
    .filter-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
    }

    .tab-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      padding: 0.55rem 1.1rem;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
    }

    .tab-btn[aria-selected="true"] {
      background: var(--forest);
      border-color: var(--forest);
      color: #F7F4EE;
    }

    .catalog-grid {
      display: grid;
      gap: 1.5rem;
    }

    @media (min-width: 680px) {
      .catalog-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 1024px) {
      .catalog-grid { grid-template-columns: repeat(4, 1fr); }
    }

    .catalog-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-card);
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .catalog-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-soft);
    }

    .catalog-card[hidden] {
      display: none;
    }

    .catalog-thumb {
      aspect-ratio: 4 / 3;
      object-fit: cover;
      width: 100%;
    }

    .catalog-body {
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 0.65rem;
    }

    .price-pill {
      display: inline-flex;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--terracotta);
      background: var(--terracotta-soft);
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      width: fit-content;
    }

    .catalog-body p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--ink-secondary);
      flex: 1;
    }

    .estimate-note {
      font-size: 0.76rem;
      color: var(--ink-muted);
      border-top: 1px solid var(--border-subtle);
      padding-top: 0.6rem;
    }

    .price-disclaimer-banner {
      margin-top: 1.75rem;
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 1rem 1.25rem;
      font-size: 0.86rem;
      color: var(--ink-secondary);
    }

    /* Styling Studio (Home vs Café/Studio) */
    .split-layout {
      display: grid;
      gap: 2rem;
      align-items: center;
    }

    @media (min-width: 920px) {
      .split-layout {
        grid-template-columns: 0.95fr 1.05fr;
        gap: 3.25rem;
      }
    }

    .mode-switch {
      display: inline-flex;
      background: var(--bg-cream);
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      padding: 0.25rem;
      margin-bottom: 1.35rem;
    }

    .mode-switch button {
      border: 0;
      background: transparent;
      padding: 0.5rem 1.05rem;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--ink-secondary);
      transition: all var(--transition);
    }

    .mode-switch button[aria-pressed="true"] {
      background: var(--forest);
      color: #F7F4EE;
    }

    .styling-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1.5rem;
    }

    .styling-list {
      margin: 1rem 0 1.25rem;
      padding-left: 1.15rem;
      color: var(--ink-secondary);
      display: grid;
      gap: 0.55rem;
      font-size: 0.94rem;
    }

    /* Workshops */
    .workshop-grid {
      display: grid;
      gap: 2rem;
      align-items: center;
    }

    @media (min-width: 920px) {
      .workshop-grid {
        grid-template-columns: 1.1fr 0.9fr;
        gap: 3rem;
      }
    }

    .workshop-modules {
      display: grid;
      gap: 0.9rem;
      margin-top: 1.35rem;
    }

    .module-row {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 1rem 1.15rem;
    }

    .module-row strong {
      display: block;
      font-size: 0.96rem;
      color: var(--forest);
      margin-bottom: 0.2rem;
    }

    .module-row span {
      font-size: 0.88rem;
      color: var(--ink-secondary);
    }

    /* FAQ */
    .faq-list {
      display: grid;
      gap: 0.85rem;
      max-width: 820px;
    }

    details.faq-item {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1.05rem 1.3rem;
    }

    details.faq-item summary {
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    details.faq-item summary::-webkit-details-marker {
      display: none;
    }

    details.faq-item summary::after {
      content: "+";
      font-size: 1.3rem;
      font-weight: 400;
      color: var(--terracotta);
      line-height: 1;
    }

    details.faq-item[open] summary::after {
      content: "−";
    }

    details.faq-item p {
      margin: 0.85rem 0 0;
      font-size: 0.93rem;
      color: var(--ink-secondary);
      border-top: 1px solid var(--border-subtle);
      padding-top: 0.85rem;
    }

    /* Non-Sending Contact Affordance */
    .contact-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      box-shadow: var(--shadow-soft);
      display: grid;
      gap: 2rem;
    }

    @media (min-width: 900px) {
      .contact-card {
        grid-template-columns: 0.95fr 1.05fr;
        padding: 2.5rem;
      }
    }

    .form-grid {
      display: grid;
      gap: 1rem;
    }

    .field label {
      display: block;
      font-size: 0.84rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      color: var(--ink-primary);
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 0.68rem 0.85rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--bg-cream);
      font-size: 0.92rem;
    }

    .field textarea {
      min-height: 96px;
      resize: vertical;
    }

    .notice-unconfigured {
      background: var(--sage-tint);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 0.85rem 1rem;
      font-size: 0.84rem;
      color: var(--ink-primary);
    }
